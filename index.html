<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Risk Governance Monitor</title>
<meta name="description" content="Global Risk Governance Monitor — an interactive map of the global catastrophic and existential risks facing humanity this century, their likelihood and impact, and the maturity of the multilateral governance that exists for each.">
<meta name="author" content="Jan Cherlet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#18181A; --ink:#F5E1E1; --umber:#4C1A09; --pink:#F2C8C9; --orange:#FF520D;
  --blue:#2951FE; --gold:#F2B101; --green:#1E800F; --brown:#4C1A09;
  --ink-dim:rgba(245,225,225,.55); --line:rgba(245,225,225,.14);
  --board:min(70vh, 92vw, 780px);
  --cell:calc(var(--board)/5.4); --gap:calc(var(--board)/54); --mcell:var(--cell);
  --serif:"Newsreader", Georgia, "Times New Roman", Times, serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.35}
body{min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- header ---------- */
header{display:flex;flex-direction:column;align-items:center;gap:.45rem;padding:1rem 1rem .2rem}
h1{margin:0;font-weight:400;font-size:clamp(1.35rem,2.6vw,2rem);letter-spacing:.01em;text-align:center}
h1 span{font-style:italic;font-weight:300;color:var(--ink-dim)}
.sub{margin:0;font-size:.95rem;color:var(--ink-dim);font-style:italic;text-align:center}
.toggle{margin-top:.3rem;display:inline-flex;border-radius:999px;background:var(--pink);padding:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.toggle button{min-width:9.2em;padding:.42em 1.1em;border-radius:999px;color:var(--umber);font-size:1rem;letter-spacing:.02em;transition:background .25s,color .25s}
.toggle button.on{background:var(--orange);color:var(--ink)}

/* ---------- stage ---------- */
main{flex:1;display:flex;align-items:flex-start;justify-content:center;gap:1.2rem;padding:.4rem 1rem 1rem}
.board{display:grid;grid-template-columns:auto var(--board);grid-template-rows:auto auto auto;gap:.6rem .7rem;align-items:center;margin-top:.9rem}
.ylab{grid-row:2;grid-column:1;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;color:var(--ink-dim);font-style:italic;font-size:.9rem;letter-spacing:.06em;white-space:nowrap}
.xlab{grid-row:1;grid-column:2;text-align:center;color:var(--ink-dim);font-style:italic;font-size:.9rem;letter-spacing:.06em}
.mrow{grid-row:3;grid-column:2;margin-top:1.1rem;padding-top:1.3rem;border-top:1px dashed var(--line)}
.mgrid{display:grid;grid-template-columns:repeat(5,var(--cell));gap:var(--gap);justify-items:center;align-items:center}
.grid{grid-row:2;grid-column:2;width:var(--board);display:grid;grid-template-columns:repeat(5,var(--cell));grid-template-rows:repeat(4,var(--cell));gap:var(--gap);position:relative}

/* ---------- cards ---------- */
.card{position:relative;width:var(--cell);height:var(--cell);border-radius:calc(var(--cell)*.09);padding:calc(var(--cell)*.09);display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer;transition:opacity .35s,transform .25s;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 6px 18px rgba(0,0,0,.35);overflow:hidden}
.card:hover{transform:translateY(-2px)}
.card.round{width:var(--mcell);height:var(--mcell);border-radius:50%;justify-content:center;align-items:center;text-align:center;padding:calc(var(--mcell)*.14);gap:calc(var(--mcell)*.03)}
.card .code{font-size:calc(var(--cell)*.10);letter-spacing:.08em;opacity:.7;font-variant:small-caps;line-height:1}
.card .name{font-size:calc(var(--cell)*.118);line-height:1.12;font-weight:500;margin-top:calc(var(--cell)*.04);hyphens:auto;overflow-wrap:break-word}
.card.round .name{font-size:calc(var(--mcell)*.11);margin:0}
.card.round .code{text-align:center;font-size:calc(var(--mcell)*.10)}
.card .kind{font-size:calc(var(--mcell)*.085);font-style:italic;opacity:.75;text-align:center;line-height:1.1}
.board.dim .card{opacity:.22}
.board.dim .card.origin{visibility:hidden}

/* meters (risk face) */
.meters{display:flex;flex-direction:column;gap:calc(var(--cell)*.045)}
.meter{display:flex;align-items:center;gap:calc(var(--cell)*.035)}
.meter b{font-size:calc(var(--cell)*.085);width:calc(var(--cell)*.09);font-weight:600;opacity:.8}
.meter i{display:block;width:calc(var(--cell)*.075);height:calc(var(--cell)*.075);border-radius:50%;border:1px solid currentColor;opacity:.28}
.meter i.range{opacity:.95;border-width:2px}
.meter i.modal{background:currentColor;opacity:1}
/* pillars (governance face) */
.pillars{display:flex;gap:calc(var(--cell)*.05);align-items:flex-end}
.pil{display:flex;flex-direction:column-reverse;align-items:center;gap:calc(var(--cell)*.02)}
.pil b{font-size:calc(var(--cell)*.08);font-weight:600;opacity:.85;margin-top:calc(var(--cell)*.025)}
.pil i{display:block;width:calc(var(--cell)*.13);height:calc(var(--cell)*.045);border-radius:2px;background:currentColor;opacity:.22}
.pil i.on{opacity:1}
.maturity{font-size:calc(var(--cell)*.095);font-style:italic;line-height:1.05;margin-top:calc(var(--cell)*.03)}
.maturity small{font-style:normal;opacity:.75}

/* colour groups */
.c-E{background:var(--blue);color:var(--ink)} .c-F{background:var(--gold);color:var(--umber)}
.c-N{background:var(--green);color:var(--ink)} .c-W{background:var(--orange);color:var(--umber)}
.c-T{background:var(--brown);color:var(--ink)} .c-M{background:var(--pink);color:var(--umber)}

/* ---------- bubbles ---------- */
.bubble{width:3rem;height:3rem;border-radius:1.5rem;background:rgba(245,225,225,.07);border:1px solid var(--line);overflow:hidden;transition:width .35s,height .35s,border-radius .35s;flex:none;align-self:flex-end;display:flex;flex-direction:column;backdrop-filter:blur(6px)}
.bubble .ic{width:3rem;height:3rem;display:flex;align-items:center;justify-content:center;flex:none;font-size:1.1rem;color:var(--ink);opacity:.85}
.bubble .ic svg{width:1.25rem;height:1.25rem;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bubble .body{display:none;padding:0 1.1rem 1.1rem;font-size:.9rem;line-height:1.4;overflow:auto}
.bubble.open{width:min(21rem,90vw);height:auto;max-height:min(var(--board),70vh);border-radius:1rem}
.bubble.open .body{display:block}
.bubble.open .ic{justify-content:space-between;padding:0 .9rem 0 1.1rem;font-style:italic;color:var(--ink-dim)}
.bubble h3{margin:.4rem 0 .35rem;font-size:.95rem;font-weight:500;letter-spacing:.03em;font-variant:small-caps}
.bubble p{margin:.3rem 0}
.bubble .row{display:flex;align-items:center;gap:.55rem;margin:.22rem 0}
.sw{width:1.05rem;height:1.05rem;border-radius:.25rem;flex:none}
.sw.round{border-radius:50%}
.bubble a{color:var(--pink)}
.bubble .dl{display:inline-block;margin:.25rem .5rem .15rem 0;padding:.25em .7em;border:1px solid var(--pink);border-radius:999px;text-decoration:none;font-size:.85rem}
.bubble .meter i, .bubble .pil i{color:var(--ink)}
.bubble .meter{gap:.2rem} .bubble .meter i{width:.5rem;height:.5rem} .bubble .meter b{width:auto;font-size:.8rem;margin-right:.2rem}
.bubble .pil i{width:.8rem;height:.3rem}

/* ---------- overlay / big card ---------- */
.veil{position:fixed;inset:0;background:rgba(24,24,26,.55);opacity:0;pointer-events:none;transition:opacity .35s;z-index:20}
.veil.on{opacity:1;pointer-events:auto}
.big{position:fixed;z-index:30;left:0;top:0;transform-origin:0 0;perspective:1600px;pointer-events:none;display:none}
.big.on{display:block;pointer-events:auto}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.1,.2,1)}
.flip.turned{transform:rotateY(180deg)}
.big.settled .flip{transform:none;transform-style:flat;transition:none}
.big.settled .face.front{display:none}
.big.settled .face.back{transform:none;backface-visibility:visible}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.face.back{transform:rotateY(180deg);padding:1.4rem 1.6rem 1.5rem;display:flex;flex-direction:column;gap:.7rem;overflow:auto;transition:opacity .18s}
.face.front{display:flex;flex-direction:column;justify-content:space-between;padding:8%}
.face.front .name{font-size:1.4rem;line-height:1.1;font-weight:500}
.face.front .code{font-variant:small-caps;letter-spacing:.08em;opacity:.7}
.big .x{position:absolute;top:.6rem;right:.8rem;font-size:1.5rem;line-height:1;opacity:.7;z-index:2}
.big .x:hover{opacity:1}
.back h2{margin:0;font-weight:500;font-size:1.55rem;line-height:1.12;padding-right:2rem}
.back .eyebrow{font-variant:small-caps;letter-spacing:.1em;font-size:.85rem;opacity:.75}
.back .desc{font-size:1rem;line-height:1.45}
.back .tags{display:flex;flex-wrap:wrap;gap:.35rem .4rem}
.tag{font-size:.78rem;padding:.2em .6em;border-radius:999px;border:1px solid currentColor;opacity:.9;white-space:nowrap}
.tag b{font-weight:600}
.back dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;font-size:.9rem}
.back dt{font-variant:small-caps;letter-spacing:.06em;opacity:.7}
.back dd{margin:0}
.back .src{font-size:.82rem;opacity:.75;font-style:italic}
.back hr{border:0;border-top:1px solid currentColor;opacity:.25;margin:.2rem 0}
.back .xl{margin:0;font-size:1rem}
.back .xl a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor}
.back .xl a:hover{opacity:.75}
.gov .ph{display:flex;align-items:baseline;gap:.6rem;margin-top:.5rem}
.gov .ph h4{margin:0;font-size:1rem;font-variant:small-caps;letter-spacing:.08em;font-weight:600}
.gov .ph .sc{display:flex;gap:3px}
.gov .ph .sc i{display:block;width:14px;height:6px;border-radius:2px;background:currentColor;opacity:.22}
.gov .ph .sc i.on{opacity:1}
.gov .mech{font-size:.92rem;line-height:1.42;margin:.15rem 0 0}
.gov .facts{font-size:.82rem;opacity:.85;margin:.15rem 0 0;line-height:1.35}
.gov .mat{font-size:1.2rem;font-style:italic}
.gov .mat b{font-style:normal;font-weight:600}
.gov .subr{font-variant:small-caps;letter-spacing:.08em;font-size:.85rem;opacity:.75;margin-top:.5rem}

.err{margin:2rem auto;max-width:36rem;text-align:center;color:var(--ink-dim);font-style:italic}

/* ---------- portrait ---------- */
@media (orientation:portrait), (max-width:820px){
  :root{--board:min(88vw, 54vh, 640px); --mcell:calc(var(--cell)*1.4)}
  .card .name{font-size:calc(var(--cell)*.105)}
  .board{grid-template-columns:auto var(--board);column-gap:.35rem}
  .ylab{font-size:.8rem}
  h1 span{display:none}
  main{flex-direction:column;align-items:center;justify-content:space-between;gap:0;padding-bottom:.9rem}
  .board{margin-top:1.4rem;gap:.7rem .6rem}
  .mrow{margin-top:2rem;padding-top:2rem}
  .mgrid{display:flex;justify-content:center;gap:calc(var(--gap)*2.2)}
  .bubbles{display:flex;gap:.8rem;width:min(92vw,660px);justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:1.6rem}
  .bubble{align-self:flex-end}
  .bubble.open{width:min(21rem,80vw)}
  .face.back{padding:1.1rem 1.1rem 1.3rem}
}
@media (min-width:821px) and (orientation:landscape){
  main{flex:none;align-items:flex-end;margin-bottom:auto}
  .bubbles{display:contents}
  #legend{order:-1}
  .bubble{margin-bottom:calc(var(--mcell)*.5 - 1.5rem)}
  .bubble.open{margin-bottom:0}
}
</style>
</head>
<body>
<header>
  <h1>Global Risk Governance Monitor <span>— catastrophic & existential risks and their multilateral governance</span></h1>
  <p class="sub" id="sub">Fourteen terminal hazards on a likelihood × impact grid; three risk multipliers below it, outside the grid.</p>
  <div class="toggle" role="tablist" aria-label="Face">
    <button id="tRisks" class="on" role="tab" aria-selected="true">Risks</button>
    <button id="tGov" role="tab" aria-selected="false">Governance</button>
  </div>
</header>

<main id="main">
  <section class="board" id="board">
    <div class="xlab">increasing likelihood →</div>
    <div class="ylab">increasing potential impact →</div>
    <div class="grid" id="grid"></div>
    <div class="mrow"><div class="mgrid" id="mgrid"></div></div>
  </section>
  <div class="bubbles">
    <aside class="bubble" id="legend">
      <button class="ic" aria-label="Legend" title="Legend"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="4" rx="1"/><rect x="4" y="12" width="10" height="4" rx="1"/><rect x="4" y="19" width="6" height="1" rx=".5"/></svg><span class="lbl" hidden>legend</span></button>
      <div class="body" id="legendBody"></div>
    </aside>
    <aside class="bubble" id="info">
      <button class="ic" aria-label="About" title="About this monitor"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span class="lbl" hidden>info</span></button>
      <div class="body" id="infoBody"></div>
    </aside>
  </div>
</main>

<div class="veil" id="veil"></div>
<div class="big" id="big"><div class="flip" id="flip"><div class="face front" id="bigFront"></div><div class="face back" id="bigBack"></div></div><button class="x" id="bigX" aria-label="Close">×</button></div>

<script>
(async function(){
  const $=s=>document.querySelector(s);
  let GR, RG;
  try{
    const [a,b]=await Promise.all([fetch('GlobalRisks.json',{cache:'no-cache'}),fetch('RiskGovernance.json',{cache:'no-cache'})]);
    if(!a.ok||!b.ok) throw new Error('HTTP '+a.status+'/'+b.status);
    GR=await a.json(); RG=await b.json();
  }catch(e){
    $('#main').innerHTML='<p class="err">The data files <code>GlobalRisks.json</code> and <code>RiskGovernance.json</code> could not be loaded ('+e.message+'). They must sit in the same folder as this page and be served over http(s) — a browser will not load them from a file:// address.</p>';
    return;
  }
  const gov=Object.fromEntries(RG.risks.map(r=>[r.code,r]));
  const risks=GR.risks;
  const LBL_L=GR.methodology.assessment_method.likelihood_scale.bands;
  const LBL_I=GR.methodology.assessment_method.impact_scale.bands;
  const grp=c=>c[0]==='M'?'M':c[0];
  const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let face='risks';

  /* ---------- card fronts ---------- */
  function dots(kind,r){
    if(kind==='L'){const m=+r.likelihood.modal[1],lo=+r.likelihood.range[0][1],hi=+r.likelihood.range[1][1];
      return '<span class="meter"><b>L</b>'+[1,2,3,4,5].map(k=>'<i class="'+(k===m?'modal':(k>=lo&&k<=hi?'range':''))+'"></i>').join('')+'</span>';}
    const m=+r.impact.modal[1],t=+r.impact.tail[1];
    return '<span class="meter"><b>I</b>'+[1,2,3,4,5].map(k=>'<i class="'+(k===m?'modal':(k>m&&k<=t?'range':''))+'"></i>').join('')+'</span>';
  }
  function pillarBars(g){
    return '<div class="pillars">'+['assess','regulate','finance','enforce'].map(p=>{
      const v=g.scores[p]; const n=typeof v==='string'?+v.split('/')[0]:v; const L=p[0].toUpperCase();
      return '<span class="pil"><b>'+L+'</b>'+[1,2,3].map(k=>'<i class="'+(k<=n?'on':'')+'"></i>').join('')+'</span>';}).join('')+'</div>';
  }
  function frontHTML(r){
    const g=gov[r.code];
    if(r.kind==='risk multiplier'){
      const mid=face==='risks'?'<div class="kind">multiplier</div>':'<div class="kind">'+esc(g.maturity)+' '+esc(g.trend)+'</div>';
      return '<div class="code">'+r.code+'</div><div class="name">'+esc(r.name)+'</div>'+mid;
    }
    const top='<div><div class="code">'+r.code+'</div><div class="name">'+esc(r.name)+'</div></div>';
    if(face==='risks') return top+'<div class="meters">'+dots('L',r)+dots('I',r)+'</div>';
    return top+'<div>'+pillarBars(g)+'<div class="maturity">'+esc(g.maturity)+' <small>'+esc(g.trend)+'</small></div></div>';
  }
  function buildGrid(){
    const grid=$('#grid'),mgrid=$('#mgrid'); grid.innerHTML=''; mgrid.innerHTML='';
    risks.forEach(r=>{
      const el=document.createElement('button');
      el.className='card c-'+grp(r.code)+(r.kind==='risk multiplier'?' round':'');
      el.dataset.code=r.code; el.setAttribute('aria-label',r.code+' '+r.name);
      el.innerHTML=frontHTML(r);
      el.addEventListener('click',()=>open(r,el));
      if(r.kind==='risk multiplier'){ el.style.gridColumn=r.grid.likelihood_col; mgrid.appendChild(el); }
      else { el.style.gridColumn=r.grid.likelihood_col; el.style.gridRow=5-Math.min(r.grid.impact_row,4); grid.appendChild(el); }
    });
  }
  function fit(){
    document.querySelectorAll('#grid .card, #mgrid .card').forEach(el=>{
      const n=el.querySelector('.name'); if(!n) return; n.style.fontSize='';
      let px=parseFloat(getComputedStyle(n).fontSize), guard=0;
      while(el.scrollHeight>el.clientHeight+1 && px>6 && guard++<12){px*=.92; n.style.fontSize=px+'px';}
    });
  }
  function refreshFronts(){document.querySelectorAll('#grid .card, #mgrid .card').forEach(el=>{el.innerHTML=frontHTML(risks.find(r=>r.code===el.dataset.code));});fit();}
  window.addEventListener('resize',()=>fit());
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);

  /* ---------- detail (back) ---------- */
  function riskBack(r){
    if(r.kind==='risk multiplier'){
      return '<div class="eyebrow">'+r.code+' · risk multiplier</div><h2>'+esc(r.name)+'</h2>'
       +'<div class="tags"><span class="tag"><b>Amplifies</b> '+esc(r.amplifies)+'</span><span class="tag"><b>Strength</b> '+esc(r.strength)+'</span></div>'
       +'<p class="desc">'+esc(r.description)+'</p><hr><dl><dt>Amplification</dt><dd>'+esc(r.amplification_detail)+'</dd><dt>Strength</dt><dd>'+esc(r.strength_detail)+'</dd></dl>'
       +'<p class="src">Multipliers are assessed qualitatively and are not placed on the likelihood × impact scale.</p>'+xlink('gov');
    }
    const L=r.likelihood, I=r.impact;
    return '<div class="eyebrow">'+r.code+' · terminal hazard · root '+esc(r.root)+(r.channel?' · '+esc(r.channel):'')+'</div><h2>'+esc(r.name)+'</h2>'
     +'<div class="tags"><span class="tag"><b>Likelihood</b> '+L.modal+' — '+esc(LBL_L[L.modal])+' · range '+L.range[0]+'–'+L.range[1]+(L.rising?' · rising':'')+'</span>'
     +'<span class="tag"><b>Impact</b> '+I.modal+' → '+I.tail+' — '+esc(LBL_I[I.modal].split(' — ')[0])+' to '+esc(LBL_I[I.tail].split(' — ')[0])+(I.tail_is_tipping_cascade?' (tipping cascade)':'')+'</span>'
     +'<span class="tag"><b>Confidence</b> '+esc(r.confidence)+'</span></div>'
     +'<p class="desc">'+esc(r.description)+'</p><hr>'
     +'<dl><dt>Time profile</dt><dd>'+esc(r.time_profile)+'</dd><dt>Severity ceiling</dt><dd>'+esc(r.severity_ceiling)+'</dd><dt>Failure mode</dt><dd>'+esc(r.failure_mode)+'</dd><dt>Impact dimensions</dt><dd>'+esc(I.dominant_dimensions)+'</dd><dt>Sources</dt><dd class="src">'+esc(r.sources)+'</dd></dl>'+xlink('gov');
  }
  function xlink(to){return '<hr><p class="xl"><a href="#" data-go="'+to+'">'+(to==='gov'?'See the multilateral governance of this risk →':'← Read the risk description')+'</a></p>';}
  const PN={assess:'Institutions to assess',regulate:'Institutions to regulate',finance:'Institutions to finance',enforce:'Institutions to enforce'};
  function pillarBlock(p,pil,score){
    const n=typeof score==='string'?+score.split('/')[0]:score;
    const facts=[pil.type&&'Type: '+pil.type, pil.coverage&&'Coverage: '+pil.coverage, pil.binding_or_powers&&(p==='enforce'?'Powers: ':'Bindingness: ')+pil.binding_or_powers, pil.status&&'Status: '+pil.status].filter(Boolean).map(esc).join(' · ');
    return '<div class="ph"><h4>'+PN[p]+'</h4><span class="sc">'+[1,2,3].map(k=>'<i class="'+(k<=n?'on':'')+'"></i>').join('')+'</span><span style="font-size:.8rem;opacity:.7">'+(typeof score==='string'?score:n)+'/3</span></div>'
     +'<p class="mech">'+(pil.mechanisms?esc(pil.mechanisms):'<i>none</i>')+'</p>'+(facts?'<p class="facts">'+facts+'</p>':'');
  }
  function govBack(r){
    const g=gov[r.code]; if(!g) return '<h2>'+esc(r.name)+'</h2><p class="desc">No governance record.</p>';
    let h='<div class="eyebrow">'+r.code+' · multilateral governance</div><h2>'+esc(r.name)+'</h2>'
      +'<div class="mat">Maturity: <b>'+esc(g.maturity)+'</b> '+esc(g.trend)+' <span style="font-size:.9rem;opacity:.75">· pillar score '+esc(g.score_sum)+'/12'+(g.capped_by_critical_actor_gate?' · capped by the critical-actor gate':'')+'</span></div>'
      +(g.maturity_note?'<p class="facts">Note: '+esc(g.maturity_note)+'</p>':'');
    if(g.sub_regimes){
      for(const [k,sr] of Object.entries(g.sub_regimes)){
        h+='<div class="subr">'+k+' — '+esc(sr.maturity)+' ('+sr.score_sum+'/12)</div>';
        for(const p of ['assess','regulate','finance','enforce']) h+=pillarBlock(p,sr.pillars[p],sr.scores[p]);
      }
    } else {
      for(const p of ['assess','regulate','finance','enforce']) h+=pillarBlock(p,g.pillars[p],g.scores[p]);
    }
    h+='<hr>'+(g.in_practice?'<dl><dt>In practice</dt><dd>'+esc(g.in_practice)+'</dd><dt>Gap</dt><dd>'+esc(g.gap)+'</dd></dl>':'<dl><dt>Gap</dt><dd>'+esc(g.gap)+'</dd></dl>')+xlink('risks');
    return h;
  }

  /* ---------- open / close ---------- */
  const big=$('#big'),flip=$('#flip'),bigF=$('#bigFront'),bigB=$('#bigBack'),veil=$('#veil'),board=$('#board');
  let openEl=null;
  function open(r,el){
    if(openEl) return;
    openEl=el; const rc=el.getBoundingClientRect();
    const W=Math.min(window.innerWidth*.92,720), H=Math.min(window.innerHeight*.86,660);
    const cls='c-'+grp(r.code);
    bigF.className='face front '+cls; bigB.className='face back '+cls+(face==='risks'?'':' gov');
    bigF.style.borderRadius=r.kind==='risk multiplier'?'50%':'14px';
    bigF.innerHTML='<div><div class="code">'+r.code+'</div><div class="name">'+esc(r.name)+'</div></div>';
    bigB.innerHTML=face==='risks'?riskBack(r):govBack(r);
    big.style.width=W+'px'; big.style.height=H+'px';
    flip.style.transition='none'; flip.className='flip';
    big.style.transition='none';
    big.style.transform=`translate(${rc.left}px,${rc.top}px) scale(${rc.width/W},${rc.height/H})`;
    big.classList.add('on'); veil.classList.add('on'); board.classList.add('dim'); el.classList.add('origin');
    big.getBoundingClientRect();
    big.style.transition='transform .6s cubic-bezier(.4,.1,.2,1)'; flip.style.transition='';
    big.style.transform=`translate(${(window.innerWidth-W)/2}px,${(window.innerHeight-H)/2}px) scale(1)`;
    setTimeout(()=>{flip.classList.add('turned');bigF.style.borderRadius='14px';},60);
    setTimeout(()=>{ if(!openEl) return; big.style.transition='none'; big.style.transform=`translate(${Math.round((window.innerWidth-W)/2)}px,${Math.round((window.innerHeight-H)/2)}px)`; big.classList.add('settled'); },720);
    bigB.scrollTop=0;
  }
  function close(){
    if(!openEl) return;
    const el=openEl,rc=el.getBoundingClientRect(),W=big.offsetWidth,H=big.offsetHeight;
    if(big.classList.contains('settled')){ flip.style.transition='none'; big.classList.remove('settled'); flip.getBoundingClientRect(); flip.style.transition=''; big.style.transition='transform .6s cubic-bezier(.4,.1,.2,1)'; }
    flip.classList.remove('turned');
    big.style.transform=`translate(${rc.left}px,${rc.top}px) scale(${rc.width/W},${rc.height/H})`;
    veil.classList.remove('on');
    setTimeout(()=>{big.classList.remove('on');board.classList.remove('dim');el.classList.remove('origin');openEl=null;},600);
  }
  bigB.addEventListener('click',e=>{const a=e.target.closest('a[data-go]'); if(!a) return; e.preventDefault(); swapFace(a.dataset.go);});
  function swapFace(to){
    if(!openEl) return; const r=risks.find(x=>x.code===openEl.dataset.code);
    setToggle(to); bigB.className='face back c-'+grp(r.code)+(to==='risks'?'':' gov');
    bigB.style.opacity=0; setTimeout(()=>{bigB.innerHTML=to==='risks'?riskBack(r):govBack(r); bigB.scrollTop=0; bigB.style.opacity=1;},180);
  }
  veil.addEventListener('click',close); $('#bigX').addEventListener('click',close);
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
  window.addEventListener('resize',()=>{if(openEl){const W=Math.min(window.innerWidth*.92,720),H=Math.min(window.innerHeight*.86,660);big.style.transition='none';big.style.width=W+'px';big.style.height=H+'px';big.style.transform=`translate(${Math.round((window.innerWidth-W)/2)}px,${Math.round((window.innerHeight-H)/2)}px)`;}});

  /* ---------- toggle ---------- */
  function setToggle(f){
    face=f; $('#tRisks').classList.toggle('on',f==='risks'); $('#tGov').classList.toggle('on',f==='gov');
    $('#tRisks').setAttribute('aria-selected',f==='risks'); $('#tGov').setAttribute('aria-selected',f==='gov');
    $('#sub').textContent=f==='risks'?'Fourteen terminal hazards on a likelihood × impact grid; three risk multipliers below it, outside the grid.':'The maturity of multilateral governance of the risks, based on four governance pillars.';
    refreshFronts(); buildLegend();
  }
  function setFace(f){ if(openEl) close(); setTimeout(()=>setToggle(f),openEl?620:0); }
  $('#tRisks').addEventListener('click',()=>setFace('risks')); $('#tGov').addEventListener('click',()=>setFace('gov'));

  /* ---------- bubbles ---------- */
  function buildLegend(){
    const cat=[['E','Earth-system destabilisation (E1–E2)','c-E'],['W','Deliberate destructive capability (W1–W3)','c-W'],['T','Loss of control over technology (T1–T3)','c-T'],['F','Loss of collective control (F1–F2)','c-F'],['N','Natural hazards (N1–N4)','c-N'],['M','Risk multipliers — round, below the grid','c-M round']];
    let h='<h3>Categories</h3>'+cat.map(c=>'<div class="row"><span class="sw '+c[2]+'"></span><span>'+c[1]+'</span></div>').join('');
    if(face==='risks'){
      h+='<h3>Likelihood of reaching catastrophic scale by 2100</h3>'+Object.entries(LBL_L).map(([k,v])=>'<div class="row"><span style="font-variant:small-caps;width:1.6rem">'+k+'</span><span>'+esc(v)+'</span></div>').join('');
      h+='<h3>Potential impact</h3>'+Object.entries(LBL_I).map(([k,v])=>'<div class="row"><span style="font-variant:small-caps;width:1.6rem">'+k+'</span><span>'+esc(v.split(' — ')[0])+'</span></div>').join('');
      h+='<h3>Card meters</h3><div class="row"><span class="meter"><i class="modal"></i></span><span>most likely (modal) band</span></div><div class="row"><span class="meter"><i class="range"></i></span><span>documented range / tail</span></div><p style="opacity:.75">Cards sit at their modal cell, or the nearest free cell within their range. Row I5 is empty: no hazard\'s <i>most likely</i> outcome is extinction.</p>';
    } else {
      const pd=RG.methodology.pillars;
      h='<h3 style="font-size:1.05rem">The four governance pillars</h3><p style="opacity:.8;margin-top:0">Each card shows four bars, one per pillar, filled 0–3 for the strength of the institutions in place:</p>'
       +[['A','Assess',pd.assess],['R','Regulate',pd.regulate],['F','Finance',pd.finance],['E','Enforce',pd.enforce]].map(x=>'<div class="row" style="align-items:flex-start;margin:.35rem 0"><span class="pil" style="margin-top:.2rem"><i class="on"></i><i class="on"></i><i class="on"></i><b>'+x[0]+'</b></span><span><b>'+x[1]+'</b> — '+esc(x[2].replace(/:.*$/,'').replace(/\.$/,'').toLowerCase())+'</span></div>').join('')+'<hr style="border:0;border-top:1px solid var(--line);margin:.6rem 0">'+h;
      h+='<h3>Maturity of multilateral governance</h3>'+Object.entries(RG.methodology.maturity_indicator.levels).map(([k,v])=>'<div class="row"><span style="font-style:italic;min-width:7.2rem">'+k+'</span><span style="opacity:.8">'+esc(v.split('. ').slice(1).join('. ')||v)+'</span></div>').join('');
      h+='<p style="opacity:.75">↑ strengthening · → stable · ↓ eroding. Maturity is capped at <i>Developing</i> where the actors who generate the risk are unbound or immune from enforcement.</p>';
    }
    $('#legendBody').innerHTML=h;
  }
  function buildInfo(){
    $('#infoBody').innerHTML='<h3>About</h3><p>The Global Risk Governance Monitor maps the global catastrophic and existential risks facing humanity this century — the UN\'s own phrase in the <i>Pact for the Future</i> (2024) — with a relative, range-based assessment of their likelihood and impact, and inventories the multilateral institutions and treaties that exist to assess, regulate, finance and enforce the reduction of each.</p>'
     +'<p>Risks are organised as a tree: two roots (nature; human activity and technology), four channels, fourteen terminal hazards, three multipliers. Governance is scored on four pillars and rolled up into a five-level maturity indicator, benchmarked against the ozone regime.</p>'
     +'<h3>Data</h3><p>Both datasets are open data under CC BY-NC 4.0 — free for non-commercial use with attribution to Jan Cherlet, globalriskgovernance.org.</p>'
     +'<a class="dl" href="GlobalRisks.json" download>GlobalRisks.json · v'+esc(GR.version)+'</a><a class="dl" href="RiskGovernance.json" download>RiskGovernance.json · v'+esc(RG.version)+'</a>'
     +'<p style="opacity:.75">Data as of '+esc(GR.date)+'. Sources: UN Global Risk Reports 2024 & 2026, RAND/HSOAC 2024, Global Challenges Foundation 2026, UK National Risk Register 2025, WEF Global Risks Report 2026, Bostrom, Ord, treaty depositaries.</p>'
     +'<h3>Credit</h3><p>Created and maintained by <a href="https://jancherlet.info" target="_blank" rel="noopener">Jan Cherlet</a>. <a href="https://globalriskgovernance.org">globalriskgovernance.org</a></p>';
  }
  document.querySelectorAll('.bubble .ic').forEach(b=>b.addEventListener('click',()=>{const bb=b.parentElement,o=bb.classList.toggle('open');b.querySelector('.lbl').hidden=!o;}));

  buildGrid(); fit(); buildLegend(); buildInfo();
})();
</script>
</body>
</html>
